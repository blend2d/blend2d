          - { title: "linux"                 , host: "ubuntu-24.04"         , arch: "x64"    , cc: "gcc-15"  , conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-24.04"         , arch: "x86"    , cc: "gcc-16"  , conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-24.04"         , arch: "x86"    , cc: "gcc-16"  , conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-24.04"         , arch: "x64"    , cc: "gcc-16"  , conf: "Debug"  , defs: "BLEND2D_TEST=1" }
