name: "Build"
on:
  push:
  pull_request:

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: ${{github.ref != 'refs/heads/master'}}

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { title: "linux/analyze-build"   , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Debug"  , defs: "BLEND2D_TEST=0"                   , diagnostics: "analyze-build"}
          - { title: "linux/asan"            , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1"                   , diagnostics: "asan", }
          - { title: "linux/msan/no-jit"     , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1,BLEND2D_NO_JIT=1"  , diagnostics: "msan", }
          - { title: "linux/tsan"            , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1"                   , diagnostics: "tsan" }
          - { title: "linux/tsan/no-futex"   , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1,BLEND2D_NO_FUTEX=1", diagnostics: "tsan" }
          - { title: "linux/ubsan"           , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1"                   , diagnostics: "ubsan", }
          - { title: "linux/hardened"        , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1"                   , diagnostics: "hardened", }
          - { title: "linux/valgrind"        , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1"                   , diagnostics: "valgrind", }
          - { title: "linux/no-jit"          , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1,BLEND2D_NO_JIT=1" }
          - { title: "linux/no-tls"          , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1,BLEND2D_NO_TLS=1" }
          - { title: "linux/no-futex"        , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1,BLEND2D_NO_FUTEX=1" }
          - { title: "linux/use-c++23"       , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Debug"  , defs: "BLEND2D_TEST=1,CMAKE_CXX_FLAGS=-std=c++23" }
          - { title: "linux/use-sse4.2"      , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1,CMAKE_CXX_FLAGS=-msse4.2" }
          - { title: "linux/use-avx"         , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1,CMAKE_CXX_FLAGS=-mavx" }
          - { title: "linux/use-avx2"        , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1,CMAKE_CXX_FLAGS=-mavx2" }

          - { title: "linux"                 , host: "ubuntu-24.04"         , arch: "x86"    , cc: "gcc-12"  , conf: "Debug"  , defs: "BLEND2D_TEST=1" }
