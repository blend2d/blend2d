          - { title: "linux"                 , host: "ubuntu-24.04-arm"     , arch: "arm64"  , cc: "clang-20", conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-24.04-arm"     , arch: "arm64"  , cc: "clang-20", conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-26.04"         , arch: "x86"    , cc: "clang-21", conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-26.04"         , arch: "x86"    , cc: "clang-21", conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-21", conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-21", conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-26.04-arm"     , arch: "arm64"  , cc: "clang-21", conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-26.04-arm"     , arch: "arm64"  , cc: "clang-21", conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-26.04"         , arch: "x86"    , cc: "clang-22", conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-26.04"         , arch: "x86"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-26.04"         , arch: "x64"    , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-26.04-arm"     , arch: "arm64"  , cc: "clang-22", conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "linux"                 , host: "ubuntu-26.04-arm"     , arch: "arm64"  , cc: "clang-22", conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "macos"                 , host: "macos-15-intel"       , arch: "x64"    , cc: "gcc-14"  , conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "macos"                 , host: "macos-15-intel"       , arch: "x64"    , cc: "gcc-14"  , conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "macos"                 , host: "macos-26-intel"       , arch: "x64"    , cc: "clang"   , conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "macos"                 , host: "macos-26-intel"       , arch: "x64"    , cc: "clang"   , conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "macos"                 , host: "macos-26"             , arch: "arm64"  , cc: "clang"   , conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "macos"                 , host: "macos-26"             , arch: "arm64"  , cc: "clang"   , conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "windows"               , host: "windows-2025-vs2026"  , arch: "x86"    , cc: "vs2026"  , conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "windows"               , host: "windows-2025-vs2026"  , arch: "x86"    , cc: "vs2026"  , conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "windows"               , host: "windows-2025-vs2026"  , arch: "x64"    , cc: "vs2026"  , conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "windows"               , host: "windows-2025-vs2026"  , arch: "x64"    , cc: "vs2026"  , conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "windows"               , host: "windows-11-vs2026-arm", arch: "arm64"  , cc: "vs2026"  , conf: "Debug"  , defs: "BLEND2D_TEST=1" }
          - { title: "windows"               , host: "windows-11-vs2026-arm", arch: "arm64"  , cc: "vs2026"  , conf: "Release", defs: "BLEND2D_TEST=1" }
          - { title: "windows/uwp"           , host: "windows-2025-vs2026"  , arch: "x64"    , cc: "vs2026"  , conf: "Release", defs: "BLEND2D_TEST=0,CMAKE_SYSTEM_NAME=WindowsStore,CMAKE_SYSTEM_VERSION=10.0,CMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0A00" }
          - { title: "freebsd"               , host: "ubuntu-latest"        , arch: "x64"    , cc: "clang"   , conf: "Release", vm: "freebsd", vm_ver: "15.1", defs: "BLEND2D_TEST=1" }
          - { title: "freebsd"               , host: "ubuntu-latest"        , arch: "arm64"  , cc: "clang"   , conf: "Release", vm: "freebsd", vm_ver: "15.1", defs: "BLEND2D_TEST=1" }
          - { title: "netbsd"                , host: "ubuntu-latest"        , arch: "x64"    , cc: "clang"   , conf: "Release", vm: "netbsd" , vm_ver: "11.0", defs: "BLEND2D_TEST=1" }
          - { title: "netbsd"                , host: "ubuntu-latest"        , arch: "arm64"  , cc: "clang"   , conf: "Release", vm: "netbsd" , vm_ver: "11.0", defs: "BLEND2D_TEST=1" }
          - { title: "openbsd"               , host: "ubuntu-latest"        , arch: "x64"    , cc: "clang"   , conf: "Release", vm: "openbsd", vm_ver: "7.9" , defs: "BLEND2D_TEST=1" }
          - { title: "openbsd"               , host: "ubuntu-latest"        , arch: "arm64"  , cc: "clang"   , conf: "Release", vm: "openbsd", vm_ver: "7.9" , defs: "BLEND2D_TEST=1" }
          - { title: "debian"                , host: "ubuntu-latest"        , arch: "arm/v7" , cc: "clang"   , conf: "Release", vm: "debian:unstable", defs: "BLEND2D_TEST=1" }
          - { title: "debian"                , host: "ubuntu-latest"        , arch: "riscv64", cc: "clang"   , conf: "Release", vm: "debian:unstable", defs: "BLEND2D_TEST=1" }
          - { title: "debian"                , host: "ubuntu-latest"        , arch: "ppc64le", cc: "clang"   , conf: "Release", vm: "debian:unstable", defs: "BLEND2D_TEST=1" }

    name: "${{matrix.title}}/${{matrix.arch}}, ${{matrix.cc}} ${{matrix.conf}}"
    runs-on: "${{matrix.host}}"

    steps:
      - name: "Checkout Blend2D"
        uses: actions/checkout@v5
        with:
          path: "source"

      - name: "Checkout AsmJit"
        uses: actions/checkout@v5
        with:
          repository: asmjit/asmjit
          path: "source/3rdparty/asmjit"

      - name: "Checkout Build Actions"
        uses: actions/checkout@v5
        with:
          repository: build-actions/build-actions
          path: "build-actions"

      - name: "Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: "Install VM"
        if: ${{matrix.vm && matrix.vm_ver}}
        uses: cross-platform-actions/action@master
        with:
          operating_system: ${{matrix.vm}}
          architecture: ${{matrix.arch}}
          version: ${{matrix.vm_ver}}
          sync_files: "runner-to-vm"
          shell: bash

      - name: "Install QEMU"
        if: ${{matrix.vm && !matrix.vm_ver}}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/${{matrix.arch}}

      - name: "Build & Test - Native"
        if: ${{!matrix.vm}}
        run: python build-actions/action.py
               --source-dir=source
               --config=source/.github/workflows/build-config.json
               --compiler=${{matrix.cc}}
               --diagnostics=${{matrix.diagnostics}}
               --architecture=${{matrix.arch}}
               --problem-matcher=auto
               --build-type=${{matrix.conf}}
               --build-defs=${{matrix.defs}}

      - name: "Build & Test - Cross Platform Actions"
        if: ${{matrix.vm && matrix.vm_ver}}
        shell: cpa.sh {0}
        run: |
          set -e

          PATH="/usr/sbin:/usr/pkg/sbin:/usr/pkg/bin:$PATH:$(pwd)/build-actions"
          CI_NETBSD_USE_PKGIN=1

          export PATH
          export CI_NETBSD_USE_PKGIN

          sh ./build-actions/prepare-environment.sh
          python3 build-actions/action.py                        \
            --source-dir=source                                  \
            --config=source/.github/workflows/build-config.json  \
            --compiler=${{matrix.cc}}                            \
            --diagnostics=${{matrix.diagnostics}}                \
            --architecture=${{matrix.arch}}                      \
            --problem-matcher=auto                               \
            --build-type=${{matrix.conf}}                        \
            --build-defs="${{matrix.defs}}"

      - name: "Build & Test - Docker + QEMU"
        if: ${{matrix.vm && !matrix.vm_ver}}
        run: |
          docker run                                               \
            --rm                                                   \
            -v $(pwd):/${{github.workspace}}                       \
            -w ${{github.workspace}}/build-actions                 \
            --platform linux/${{matrix.arch}}                      \
            ${{matrix.vm}}                                         \
            bash action.sh                                         \
            --source-dir=../source                                 \
            --config=../source/.github/workflows/build-config.json \
            --compiler=${{matrix.cc}}                              \
            --diagnostics=${{matrix.diagnostics}}                  \
            --architecture=${{matrix.arch}}                        \
            --problem-matcher=auto                                 \
            --build-type=${{matrix.conf}}                          \
            --build-defs="${{matrix.defs}}"
